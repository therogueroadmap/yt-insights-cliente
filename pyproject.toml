[project]
name = "yt-insights-cliente"
version = "0.2.0"
description = "Cliente local de yt-insights: terminal yti y servidor MCP stdio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "The Rogue Roadmap" }]
dependencies = [
    "filelock>=4.2.12",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "platformdirs>=4.14.7",
    "pydantic>=2,<3",
    "tomli-w>=1.2.0",
    "yt-dlp>=2026.10.26",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "yti_cliente"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[project.urls]
Repository = "https://github.com/therogueroadmap/yt-insights-cliente"

[project.scripts]
yti = "yti_cliente.cli:main"
